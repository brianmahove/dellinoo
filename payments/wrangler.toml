name = "dellinoo-payments"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = true
preview_urls = false

# Plain, non-secret config. Secrets (PAYNOW_INTEGRATION_KEY,
# FIREBASE_SERVICE_ACCOUNT_JSON) are set with `wrangler secret put <NAME>`
# and never appear in this file — see .dev.vars.example.
[vars]
PAYNOW_INTEGRATION_ID = "27083"
FIREBASE_PROJECT_ID = "mobile-billing-system-d2bfb"

# Wishlist price-drop alerts (src/pricedrops.ts), every 6 hours. Free on
# Cloudflare's plan, unlike scheduled Cloud Functions on Firebase.
[triggers]
crons = ["0 */6 * * *"]
