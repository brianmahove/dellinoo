name = "dellinoo-payments"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = true
preview_urls = false

# Plain, non-secret config. Secrets (PAYNOW_INTEGRATION_KEY,
# FIREBASE_SERVICE_ACCOUNT_JSON, SUPABASE_SECRET_KEY) are set with `wrangler secret put <NAME>`
# and never appear in this file — see .dev.vars.example.
[vars]
PAYNOW_INTEGRATION_ID = "27083"
FIREBASE_PROJECT_ID = "mobile-billing-system-d2bfb"
# Image storage (src/images.ts) — Supabase free tier, project "dellinoo".
SUPABASE_URL = "https://fjrbtgomeffbxcztkbwe.supabase.co"
SUPABASE_BUCKET = "dellinoo-images"

# Every 6 hours: wishlist price-drop alerts (src/pricedrops.ts), unpaid-order
# reminders (src/reminders.ts) and the Supabase keep-alive. Free on
# Cloudflare's plan, unlike scheduled Cloud Functions on Firebase.
[triggers]
# The second one (Sundays 03:00 UTC) is weekly housekeeping: prunes inbox
# items/promos older than 90 days (src/housekeeping.ts) and deletes photos no
# product, order, review or request uses (src/images.ts). index.ts's
# WEEKLY_CRON must match it.
crons = ["0 */6 * * *", "0 3 * * SUN"]
